<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Firmware Flash Tool</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="https://unpkg.com/esp-web-tools@latest/dist/web/install-button.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="stepContent">
      <div class="logo-container">
        <img src="assets/img/logo.png" alt="Logo" class="logo-hero">
      </div>
      <h1 class="hero-title">ESP Installer</h1>
      <p class="hero-description">
        Starte deinen ESP32 in wenigen Schritten.<br>
        Dieser Assistent hilft dir, Firmware zu flashen, das WLAN korrekt einzurichten und den WebClient auf der richtigen Geräte-IP zu finden.
      </p>
      <button id="startAssistantBtn" class="styledBtn hero-btn">Installation Assistent starten</button>
    </div>
    <div class="bottomBar">
      <button id="backButton" class="navBtn">← Back</button>
      <div class="page-indicator" id="pageIndicator"></div>
      <button id="nextButton" class="navBtn">Next →</button>
    </div>
  </div>
  <div class="footer">
    Made with <span class="heart">♥</span> by Severin Holm (2025 hf-ict - IoT)
  </div>
</body>
</html>
